# fork-assembler manifest: INTENT only -- which refs are tracked, in what order.
# manifest.lock.json records FACT: the OIDs the last build used and the
# assembled tree hash. The assembled branch is compiled output; never develop
# on it or merge it back.
# Derived entries may opt into updating a writable review branch after a full
# successful build with: reconstruction_publish = "remote:branch".

# How conflicts are written out: "diff3" (default), "zdiff3" or "merge". Part
# of the recipe -- tracked rerere pairs replay only under the style they were
# recorded with, so changing it strands every pair already in resolutions/.
# conflict_style = "diff3"

[remotes]
upstream = "git@github.com:duxlabs-dev/dux-qt-base"
mine = "git@github.com:colonelpanic8/dux-qt-base"

[base]
remote = "upstream"
ref = "master"
# submodule = "upstream"  # optional: source base objects from this submodule path

[publish]
remote = "mine"
branch = "assembled"
tag_prefix = "dux-qt-base-assembled"

[[entry]]
branch = "mine:sni/watcher-unregister-match"
summary = "Match whole service names when tray items unregister"

[[entry]]
branch = "mine:sni/validate-icon-pixmaps"
summary = "Reject tray icon pixmaps with too little data"

[[entry]]
branch = "mine:sni/lenient-status"
summary = "Treat a missing or nonconformant tray item status as active"

[[entry]]
branch = "mine:sni/category-default"
summary = "Default missing and nonconformant tray categories to ApplicationStatus"

[[entry]]
branch = "mine:sni/fix-default-sort"
summary = "Only compare tray item ids within the same category"

[[entry]]
branch = "mine:sni/quiet-missing-optional-props"
summary = "Don't warn when absent optional D-Bus properties fail to read"

[[entry]]
branch = "mine:sni/context-menu"
summary = "Add the tray item contextMenu() invokable"

[[entry]]
branch = "mine:sni/icon-theme-path-updates"
summary = "Update the tray icon theme path and icon names together"
fixup = "patches/icon-theme-path-updates-quiet-optional-props.patch"

[[entry]]
branch = "mine:sni/overlay-pixmaps"
summary = "Include overlay pixmaps when choosing the tray icon source"

[[entry]]
branch = "mine:sni/777-icon-lookup"
summary = "Search icon theme paths for icon files"

[[entry]]
branch = "mine:sni/777-icon-fallbacks"
summary = "Fall back between tray icon names and pixmaps"

[[entry]]
branch = "mine:sni/777-pixmap-rendering"
summary = "Better tray pixmap selection; overlay drawn as a corner badge"
fixup = "patches/777-pixmap-rendering-keep-aspect-ratio.patch"

[[entry]]
branch = "mine:sni/watcher-address"
summary = "Expose the tray item's watcher registration address (watcherAddress)"

[[exclude]]
branch = "mine:notifications/image-data-rowstride"
reason = "not ported: dux-qt-base already honours image-data rowstride and validates its size (981ff4d), and pads GdkPixbuf's short last row (93a1772)"

# Entries merge in order onto the base. Three kinds:
#
# [[entry]]
# branch = "mine:some-topic"      # a live topic branch on a named remote
# pr = 1234                       # optional metadata: the PR this branch is
#                                 # published as (provenance link + dedup)
#
# [[entry]]
# pr = 1234                       # refs/pull/1234/head; remote = "upstream" by default
# fixup = "patches/example.patch" # optional coherence fixup: applied inside
#                                 # THIS entry's step, right after its merge,
#                                 # repairing what admitting it broke across
#                                 # the earlier entries. Keeps every entry
#                                 # boundary a coherent tree. Attach it with
#                                 # `fork-assembler fixup ENTRY FILE --capture`.
#
# [[entry]]
# patch = "patches/example.patch" # a STANDALONE patch at its own position,
#                                 # for content belonging to no entry (e.g.
#                                 # site-local customization). Cross-entry
#                                 # repairs belong in a fixup instead.

# Targets deliberately NOT carried. Absence records nothing: `add --prs-from`
# re-appends every open PR it finds, so commenting an entry out is inert.
# An exclusion is the positive refusal, and the only form of it that survives
# a discovery sweep. Record one with `fork-assembler exclude`; it never touches the
# lock, so nothing needs rebuilding.
#
# [[exclude]]
# pr = 1234                       # or branch = "mine:some-topic", or
#                                 # patch = "patches/example.patch"
# reason = "superseded by 1240, which already contains it"
